[package]
name = "catchup"
version = "0.1.0"
edition = "2021"
description = "Fetch every repo open in cmux and browse what colleagues pushed"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
